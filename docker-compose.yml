version: "3.8"

# ============================================================
# AI 量化交易工作台 — Docker 部署配置
# ============================================================
# 开发环境: docker compose --profile dev up
# 生产环境: docker compose --profile prod up
# 监控环境: docker compose --profile monitoring up
# 仅行情桥接: docker compose up akshare-bridge
# ============================================================

services:
  # ==========================================================
  # 生产环境 — 后端 API 服务
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: kairos-quant:latest
    container_name: kairos-backend
    ports:
      - "3001:3001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - WEB_ORIGIN=http://localhost:4173
      - MARKET_MODE=mock
      - STORE_BACKEND=memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - prod

  # ==========================================================
  # 生产环境 — 前端静态资源服务 (vite preview)
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: kairos-quant:latest
    container_name: kairos-frontend
    ports:
      - "4173:4173"
    environment:
      - VITE_API_TARGET=http://backend:3001
    command:
      - sh
      - -c
      - |
        cat > /app/vite.config.docker.ts << 'VITEEOF'
        import { defineConfig } from "vite";
        import react from "@vitejs/plugin-react";
        export default defineConfig({
          plugins: [react()],
          server: {},
          preview: {
            host: "0.0.0.0",
            port: 4173,
            strictPort: true,
            proxy: {
              "/api": { target: "http://backend:3001", changeOrigin: true },
              "/ws":  { target: "ws://backend:3001", ws: true }
            }
          }
        });
        VITEEOF
        npx vite preview --config /app/vite.config.docker.ts
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - prod

  # ==========================================================
  # 开发环境 — 后端 API (热重载: tsx watch)
  # ==========================================================
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: kairos-quant:dev
    container_name: kairos-backend-dev
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.server.json:/app/tsconfig.server.json:ro
      - ./tsconfig.node.json:/app/tsconfig.node.json:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - WEB_ORIGIN=http://localhost:5173
      - MARKET_MODE=mock
      - STORE_BACKEND=memory
    command: ["npx", "tsx", "watch", "server/index.ts"]
    profiles:
      - dev

  # ==========================================================
  # 开发环境 — 前端 Vite (热重载 HMR, 端口 5173)
  # ==========================================================
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: kairos-quant:dev
    container_name: kairos-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./shared:/app/shared
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.app.json:/app/tsconfig.app.json:ro
    environment:
      - VITE_API_TARGET=http://backend-dev:3001
    command:
      - sh
      - -c
      - |
        cat > /app/vite.config.docker.ts << 'VITEEOF'
        import { defineConfig } from "vite";
        import react from "@vitejs/plugin-react";
        export default defineConfig({
          plugins: [react()],
          server: {
            host: "0.0.0.0",
            port: 5173,
            strictPort: true,
            proxy: {
              "/api": { target: "http://backend-dev:3001", changeOrigin: true },
              "/ws":  { target: "ws://backend-dev:3001", ws: true }
            }
          }
        });
        VITEEOF
        npx vite --config /app/vite.config.docker.ts
    depends_on:
      - backend-dev
    profiles:
      - dev

  # ==========================================================
  # AkShare 行情桥接微服务
  # ==========================================================
  akshare-bridge:
    build:
      context: ./akshare-bridge
      dockerfile: Dockerfile
    image: kairos-akshare-bridge:latest
    container_name: kairos-akshare
    ports:
      - "8800:8800"
    environment:
      - TZ=Asia/Shanghai
      - AKSHARE_BRIDGE_HOST=0.0.0.0
      - AKSHARE_BRIDGE_TOKEN=${AKSHARE_BRIDGE_TOKEN:-}
      - AKSHARE_BRIDGE_ORIGINS=http://backend:3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - prod
      - dev

  # ==========================================================
  # Prometheus 监控采集
  # ==========================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: kairos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    profiles:
      - monitoring

  # ==========================================================
  # Grafana 仪表盘可视化
  # ==========================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: kairos-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
