# Prometheus 配置文件
# 采集 KAIROS Quant 后端的 /metrics 端点

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "kairos-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8787"]
        labels:
          service: "kairos-quant"
          env: "local"

  # 如果 backend 容器在同一个 docker 网络中，使用服务名
  - job_name: "kairos-backend-docker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: "kairos-quant"
          env: "docker"
    # 本地开发时 backend 可能不在 Docker 中，允许采集失败
    scrape_interval: 30s
